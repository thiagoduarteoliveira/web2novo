<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Cadastro de Usuário</title>
</head>

<body>

    <!-- Título da página -->
    <h1>Cadastro de Usuário</h1>

    <!-- Formulário de cadastro -->
    <form>

        <!-- Campo para digitar o nome -->
        <label>Nome:</label><br>
        <input type="text" name="nome" required>

        <br><br>

        <!-- Botão do formulário -->
        <button type="submit">Cadastrar</button>

    </form>

</body>

</html>
